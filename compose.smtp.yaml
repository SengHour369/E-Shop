# Apply after compose.local.yaml when real SMTP delivery is explicitly enabled.
services:
  auth-service:
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?Real SMTP requires MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?Real SMTP requires MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "10000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "15000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "15000"
