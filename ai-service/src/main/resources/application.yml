server:
  port: 8085
  forward-headers-strategy: none
spring:
  servlet:
    multipart:
      max-file-size: ${AI_IMPORT_MAX_BYTES:5242880}
      max-request-size: ${AI_IMPORT_MAX_REQUEST_BYTES:6291456}
  application:
    name: ai-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5437/ai_db}
    username: ${DATABASE_USERNAME:eshop}
    password: ${DATABASE_PASSWORD:eshop}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: NONE
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 20
      properties:
        max.partition.fetch.bytes: 65536
    listener:
      ack-mode: record
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false
jwt:
  secret: ${JWT_SECRET}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %-5level service=ai-service requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-} eventId=%X{eventId:-} [%thread] %logger{36} - %msg%n"
ai:
  import:
    signing-key: ${AI_IMPORT_SIGNING_KEY:}
    max-bytes: ${AI_IMPORT_MAX_BYTES:5242880}
    max-rows: ${AI_IMPORT_MAX_ROWS:10000}
    max-columns: ${AI_IMPORT_MAX_COLUMNS:64}
    max-sheets: ${AI_IMPORT_MAX_SHEETS:16}
  quota:
    daily-limit: ${AI_DAILY_REQUEST_LIMIT:5}
    timezone: ${AI_BUSINESS_TIMEZONE:Asia/Phnom_Penh}
  inference-url: ${AI_INFERENCE_URL:http://localhost:8000}
  inference-timeout-seconds: ${AI_INFERENCE_TIMEOUT_SECONDS:25}

  training:
    seed:
      enabled: ${AI_TRAINING_SEED_ENABLED:false}


