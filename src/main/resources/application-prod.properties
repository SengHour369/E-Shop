# Production profile (example) - DO NOT COMMIT secrets in real projects
# Use environment variables or a secrets manager in production

# Server
server.port=8080

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Redis (use TLS and AUTH for managed services)
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
# If using a managed Redis with TLS
# spring.data.redis.ssl.enabled=true

# Cache tuning
spring.cache.redis.time-to-live=600000

# Cloudinary and Mail
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Bakong
bakong.base-url=${BAKONG_BASE_URL}
bakong.account-id=${BAKONG_ACCOUNT_ID}
