# Local development extension: docker compose -f compose.yaml -f compose.ai.yaml up -d --build
services:
  kafka:
    image: apache/kafka:4.0.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
  ai-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: ${AI_DATABASE_USERNAME:-eshop}
      POSTGRES_PASSWORD: ${AI_DATABASE_PASSWORD:-eshop}
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["ai_db_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ai_db"]
      interval: 5s
      retries: 10
  notification-db:
    image: postgres:18
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${NOTIFICATION_DATABASE_USERNAME:-eshop}
      POSTGRES_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-eshop}
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["notification_db_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d notification_db"]
      interval: 5s
      retries: 10
  ai-inference:
    build:
      context: ./ai-inference
    ports: ["127.0.0.1:8000:8000"]
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-20}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.70}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    # AI is reachable through the gateway; no host port is needed.
    environment:
      AUTHORIZATION_AUTH_URL: http://auth-service:8081
      AI_KNOWLEDGE_ENABLED: ${AI_KNOWLEDGE_ENABLED:-false}
      AI_KNOWLEDGE_EMBEDDING_URL: ${AI_KNOWLEDGE_EMBEDDING_URL:-http://host.docker.internal:11434}
      AI_KNOWLEDGE_EMBEDDING_MODEL: ${AI_KNOWLEDGE_EMBEDDING_MODEL:-}
      DATABASE_URL: jdbc:postgresql://ai-db:5432/ai_db
      DATABASE_USERNAME: ${AI_DATABASE_USERNAME:-eshop}
      DATABASE_PASSWORD: ${AI_DATABASE_PASSWORD:-eshop}
      JWT_SECRET: ${JWT_SECRET:-66546A5744444446E5A7234743777217A25432A462D4A614E645267556B587032733576}
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AI_INFERENCE_URL: http://ai-inference:8000
      REDIS_HOST: gateway-redis
    depends_on:
      ai-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
      discovery-server: {condition: service_started}
      ai-inference: {condition: service_healthy}
      gateway-redis: {condition: service_healthy}
    restart: unless-stopped
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports: ["127.0.0.1:8086:8086"]
    environment:
      DATABASE_URL: jdbc:postgresql://notification-db:5432/notification_db
      DATABASE_USERNAME: ${NOTIFICATION_DATABASE_USERNAME:-eshop}
      DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-eshop}
      JWT_SECRET: ${JWT_SECRET:-66546A5744444446E5A7234743777217A25432A462D4A614E645267556B587032733576}
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: gateway-redis
    depends_on:
      notification-db: {condition: service_healthy}
      kafka: {condition: service_healthy}
      discovery-server: {condition: service_started}
      gateway-redis: {condition: service_healthy}
    restart: unless-stopped
  catalog-service:
    environment:
      SCANNER_AI_INFERENCE_URL: http://ai-inference:8000
volumes:
  kafka_data:
  ai_db_data:
  notification_db_data:
