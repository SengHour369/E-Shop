server:
  forward-headers-strategy: none
  port: 8084

spring:
  application:
    name: payment-service
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: senghour
    password: senghour369
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false

jwt:
  header: Authorization
  prefix: Bearer
  secret: ${JWT_SECRET:66546A5744444446E5A7234743777217A25432A462D4A614E645267556B587032733576}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

bakong:
  khqr-type: ${BAKONG_KHQR_TYPE:MERCHANT}
  city: ${BAKONG_CITY:KH}
  account-id: ${BAKONG_ACCOUNT_ID:}
  base-url: ${BAKONG_BASE_URL:https://api-bakong.nbc.gov.kh}
  email: ${BAKONG_EMAIL:}
  app-payment:
    enabled: ${BAKONG_APP_PAYMENT_ENABLED:false}
    source-info-enabled: ${BAKONG_APP_SOURCE_INFO_ENABLED:true}
    return-origin: ${BAKONG_RETURN_ORIGIN:}
    allowed-link-hosts: ${BAKONG_ALLOWED_LINK_HOSTS:}
  app-name: E-Shop
  app-icon-url: ${BAKONG_APP_ICON_URL:}
app:
  base-url: ${APP_BASE_URL:https://random-subdomain.trycloudflare.com}
  exchange-rate:
    usd-to-khr: 4100

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSSXXX} %-5level service=payment-service requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-} [%thread] %logger{36} - %msg%n"

# Apply db/upgrade/20261011_commerce_automation.sql before enabling.
automation:
  enabled: ${COMMERCE_AUTOMATION_ENABLED:false}
  input-topic: commerce.orders.v1
  api-path: /api/v1/payments/automation
  merchant-name: ${KHQR_MERCHANT_NAME:}
  merchant-id: ${KHQR_MERCHANT_ID:}
  acquiring-bank: ${KHQR_ACQUIRING_BANK:}
