# Local Ollama runtime for the E-Shop assistant. Merge after compose.ai.yaml.
services:
  ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
  api-gateway:
    environment:
      AI_GATEWAY_RESPONSE_TIMEOUT_MS: "200000"
      AI_GATEWAY_TIMEOUT: 200s
  ai-inference:
    environment:
      AI_PROVIDER: OLLAMA
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_BASE_URL: http://ollama:11434
      AI_REQUEST_TIMEOUT_SECONDS: "90"
  ai-service:
    environment:
      AI_INFERENCE_TIMEOUT_SECONDS: "95"
volumes:
  ollama-models:


